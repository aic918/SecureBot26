# Nav2 parameters for SecureBot (ROS 2 Humble, RPLidar A1M8 + 2 front HC-SR04 + rf2o odometry).
# Generated from /opt/ros/humble/share/nav2_bringup/params/nav2_params.yaml with these changes:
#   - use_sim_time false everywhere; unused robot_state_publisher / smoother_server / map_saver removed
#   - amcl: base_link frame, A1M8 range 0.2-10 m, fewer particles for the Jetson, updates every 10 cm,
#     initial pose = map origin (where mapping started)
#   - controller: Regulated Pure Pursuit, 0.18 m/s, rotates in place to the path heading, no reversing
#   - costmaps: footprint 30 x 26 cm (PLACEHOLDER until the robot is measured); local = LiDAR
#     obstacle layer + ultrasonic range layer (covers the tower's blind wedge straight ahead)
#   - velocity smoother: max 0.2 m/s, 0.8 rad/s, gentle acceleration
#   - collision_monitor (new): last check between Nav2 and the robot; stop zone 15-35 cm ahead,
#     slowdown zone to 60 cm, fed by /scan AND both ultrasonics
# Velocity chain: controller/behaviors -> cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed ->
#   collision_monitor -> nav_cmd_vel -> motion_manager_node (security gate) -> cmd_vel -> bridge
amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: 0.2
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 1000
    min_particles: 200
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.15
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names: [nav2_compute_path_to_pose_action_bt_node, nav2_compute_path_through_poses_action_bt_node,
      nav2_smooth_path_action_bt_node, nav2_follow_path_action_bt_node, nav2_spin_action_bt_node, nav2_wait_action_bt_node,
      nav2_assisted_teleop_action_bt_node, nav2_back_up_action_bt_node, nav2_drive_on_heading_bt_node,
      nav2_clear_costmap_service_bt_node, nav2_is_stuck_condition_bt_node, nav2_goal_reached_condition_bt_node,
      nav2_goal_updated_condition_bt_node, nav2_globally_updated_goal_condition_bt_node, nav2_is_path_valid_condition_bt_node,
      nav2_initial_pose_received_condition_bt_node, nav2_reinitialize_global_localization_service_bt_node,
      nav2_rate_controller_bt_node, nav2_distance_controller_bt_node, nav2_speed_controller_bt_node, nav2_truncate_path_action_bt_node,
      nav2_truncate_path_local_action_bt_node, nav2_goal_updater_node_bt_node, nav2_recovery_node_bt_node,
      nav2_pipeline_sequence_bt_node, nav2_round_robin_node_bt_node, nav2_transform_available_condition_bt_node,
      nav2_time_expired_condition_bt_node, nav2_path_expiring_timer_condition, nav2_distance_traveled_condition_bt_node,
      nav2_single_trigger_bt_node, nav2_goal_updated_controller_bt_node, nav2_is_battery_low_condition_bt_node,
      nav2_navigate_through_poses_action_bt_node, nav2_navigate_to_pose_action_bt_node, nav2_remove_passed_goals_action_bt_node,
      nav2_planner_selector_bt_node, nav2_controller_selector_bt_node, nav2_goal_checker_selector_bt_node,
      nav2_controller_cancel_bt_node, nav2_path_longer_on_approach_bt_node, nav2_wait_cancel_bt_node,
      nav2_spin_cancel_bt_node, nav2_back_up_cancel_bt_node, nav2_assisted_teleop_cancel_bt_node, nav2_drive_on_heading_cancel_bt_node,
      nav2_is_battery_charging_condition_bt_node]
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters: {use_sim_time: false}
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters: {use_sim_time: false}
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.5,
      movement_time_allowance: 10.0}
    general_goal_checker: {stateful: true, plugin: 'nav2_controller::SimpleGoalChecker', xy_goal_tolerance: 0.15,
      yaw_goal_tolerance: 0.3}
    FollowPath: {plugin: 'nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController', desired_linear_vel: 0.18,
      lookahead_dist: 0.45, min_lookahead_dist: 0.3, max_lookahead_dist: 0.8, lookahead_time: 1.5, rotate_to_heading_angular_vel: 0.8,
      transform_tolerance: 0.2, use_velocity_scaled_lookahead_dist: false, min_approach_linear_velocity: 0.08,
      approach_velocity_scaling_dist: 0.5, use_collision_detection: true, max_allowed_time_to_collision_up_to_carrot: 1.5,
      use_regulated_linear_velocity_scaling: true, use_cost_regulated_linear_velocity_scaling: true, regulated_linear_scaling_min_radius: 0.9,
      regulated_linear_scaling_min_speed: 0.08, use_rotate_to_heading: true, allow_reversing: false, rotate_to_heading_min_angle: 0.6,
      max_angular_accel: 2.0, max_robot_pose_search_dist: 10.0}
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins: [obstacle_layer, range_layer, inflation_layer]
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 3.0, inflation_radius: 0.3}
      always_send_full_costmap: true
      footprint: '[[0.15, 0.13], [0.15, -0.13], [-0.15, -0.13], [-0.15, 0.13]]'
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: LaserScan,
          raytrace_max_range: 4.0, raytrace_min_range: 0.0, obstacle_max_range: 3.5, obstacle_min_range: 0.0}
      range_layer:
        plugin: nav2_costmap_2d::RangeSensorLayer
        enabled: true
        topics: [/ultrasonic/left, /ultrasonic/right]
        clear_on_max_reading: true
        clear_threshold: 0.2
        mark_threshold: 0.8
        phi: 1.2
        inflate_cone: 1.0
        no_readings_timeout: 2.0
        input_sensor_type: VARIABLE
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: LaserScan,
          raytrace_max_range: 4.0, raytrace_min_range: 0.0, obstacle_max_range: 3.5, obstacle_min_range: 0.0}
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 3.0, inflation_radius: 0.35}
      always_send_full_costmap: true
      footprint: '[[0.15, 0.13], [0.15, -0.13], [-0.15, -0.13], [-0.15, 0.13]]'
map_server:
  ros__parameters: {use_sim_time: false, yaml_filename: ''}
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: [GridBased]
    GridBased: {plugin: nav2_navfn_planner/NavfnPlanner, tolerance: 0.5, use_astar: false, allow_unknown: true}
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin: {plugin: nav2_behaviors/Spin}
    backup: {plugin: nav2_behaviors/BackUp}
    drive_on_heading: {plugin: nav2_behaviors/DriveOnHeading}
    wait: {plugin: nav2_behaviors/Wait}
    assisted_teleop: {plugin: nav2_behaviors/AssistedTeleop}
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: 'nav2_waypoint_follower::WaitAtWaypoint', enabled: true, waypoint_pause_duration: 200}
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.2, 0.0, 0.8]
    min_velocity: [-0.1, 0.0, -0.8]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.8, 0.0, -2.0]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: nav_cmd_vel
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [PolygonStop, PolygonSlow]
    PolygonStop:
      type: polygon
      action_type: stop
      max_points: 3
      points: [0.35, 0.16, 0.35, -0.16, 0.15, -0.16, 0.15, 0.16]
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true
    PolygonSlow:
      type: polygon
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.4
      points: [0.6, 0.25, 0.6, -0.25, 0.15, -0.25, 0.15, 0.25]
      visualize: true
      polygon_pub_topic: polygon_slowdown
      enabled: true
    observation_sources: [scan, us_left, us_right]
    scan: {type: scan, topic: /scan, enabled: true}
    us_left: {type: range, topic: /ultrasonic/left, obstacles_angle: 0.15, enabled: true}
    us_right: {type: range, topic: /ultrasonic/right, obstacles_angle: 0.15, enabled: true}
